<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the safe-area insets in styles.css take effect
         on notched phones. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>MathCoach</title>
    <meta
      name="description"
      content="Calculus to backpropagation, one technique per chapter."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#0e141b"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#eef1f5"
      media="(prefers-color-scheme: light)"
    />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />

    <!-- iOS ignores the web manifest for Add to Home Screen, so the icon,
         standalone mode and status bar all need their own legacy tags. Without
         these you get a screenshot thumbnail and full browser chrome. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MathCoach" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Same three faces as docs/ROADMAP.md's published page, so the app and
         the roadmap read as one thing: Spectral for display, IBM Plex Sans for
         body, IBM Plex Mono for notation and labels. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
